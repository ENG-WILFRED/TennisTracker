name: CI/CD Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://vico:vico@localhost:5432/vico'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # REQUIRED CHECKS - These MUST pass to merge
  # ═══════════════════════════════════════════════════════════════

  typecheck:
    name: 🎯 TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎯 TypeScript Check
        run: npx tsc --noEmit
        
      - name: ✅ Report
        if: success()
        run: echo "✅ TypeScript check passed - No type errors found"

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: typecheck

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application
        run: npm run build

      - name: ✅ Report
        if: success()
        run: |
          echo "✅ Build completed successfully"
          echo "- Next.js build: ✓"
          echo "- Prisma Client generated: ✓"

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: ✅ Report
        if: success()
        run: echo "✅ Linting passed - Code quality verified"

  migrations:
    name: 📋 Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vico
          POSTGRES_PASSWORD: vico
          POSTGRES_DB: vico
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📋 Check Migration Status
        run: npx prisma migrate status

      - name: 🗄️ Validate Schema
        run: npx prisma db push --skip-generate --skip-db-push --force-skip-build

      - name: ✅ Report
        if: success()
        run: |
          echo "✅ Migrations validated"
          echo "- Migration history: ✓"
          echo "- Schema validation: ✓"

  # ═══════════════════════════════════════════════════════════════
  # INFORMATIONAL CHECKS - Can fail without blocking merge
  # ═══════════════════════════════════════════════════════════════

  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vico
          POSTGRES_PASSWORD: vico
          POSTGRES_DB: vico
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm run test:pilot
        continue-on-error: true

      - name: 📊 Test Report
        if: always()
        run: |
          echo "📊 Test Results"
          echo "- Status: Informational (non-blocking)"

  # ═══════════════════════════════════════════════════════════════
  # SUMMARY & REPORTING
  # ═══════════════════════════════════════════════════════════════

  quality-gate-summary:
    name: ✅ Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [typecheck, build, lint, migrations, tests]
    if: always()

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🎯 Determine Overall Status
        run: |
          # Required checks
          TYPECHECK_STATUS="${{ needs.typecheck.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          LINT_STATUS="${{ needs.lint.result }}"
          MIGRATIONS_STATUS="${{ needs.migrations.result }}"
          
          # Informational checks
          TESTS_STATUS="${{ needs.tests.result }}"
          
          # Determine overall result
          if [[ "$TYPECHECK_STATUS" == "success" && "$BUILD_STATUS" == "success" && "$LINT_STATUS" == "success" && "$MIGRATIONS_STATUS" == "success" ]]; then
            echo "✅ ALL REQUIRED CHECKS PASSED"
            echo "MERGE_READY=true" >> $GITHUB_ENV
          else
            echo "❌ REQUIRED CHECKS FAILED"
            echo "MERGE_READY=false" >> $GITHUB_ENV
          fi

      - name: 📝 Generate Summary Report
        run: |
          cat > /tmp/quality_report.txt << 'EOF'
          ═══════════════════════════════════════════════════════════════
          🚀 QUALITY GATE REPORT
          ═══════════════════════════════════════════════════════════════
          
          REQUIRED CHECKS (Must Pass to Merge):
          ───────────────────────────────────────────────────────────────
          ✓ TypeScript Check:      ${{ needs.typecheck.result }}
          ✓ Build:                 ${{ needs.build.result }}
          ✓ Lint:                  ${{ needs.lint.result }}
          ✓ Migrations:            ${{ needs.migrations.result }}
          
          INFORMATIONAL CHECKS (Non-Blocking):
          ───────────────────────────────────────────────────────────────
          • Tests:                 ${{ needs.tests.result }}
          
          ═══════════════════════════════════════════════════════════════
          MERGE STATUS: ${{ env.MERGE_READY == 'true' && '✅ READY TO MERGE' || '❌ BLOCKED' }}
          ═══════════════════════════════════════════════════════════════
          
          What This Report Means:
          
          ✅ REQUIRED CHECKS:
          - Build produces valid JavaScript/CSS
          - No TypeScript compilation errors
          - Code meets linting standards
          - Database migrations are valid
          
          ℹ️ INFORMATIONAL CHECKS:
          - Unit tests (for awareness, not blocking)
          - Can be monitored separately
          
          🔐 Branch Protection:
          - This branch requires all REQUIRED checks to pass
          - If any required check fails, merge is blocked
          - This prevents broken code from reaching production
          
          EOF
          cat /tmp/quality_report.txt

      - name: 🎯 Enforce Quality Gate
        run: |
          if [[ "${{ env.MERGE_READY }}" != "true" ]]; then
            echo "❌ Quality gate failed. Required checks did not pass."
            exit 1
          fi
          echo "✅ Quality gate passed. Ready for merge."
          Generated at: ${{ github.event.head_commit.timestamp }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          EOF
          cat /tmp/summary.md

      - name: 📤 Post Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
        continue-on-error: true

      - name: 📊 Display Final Report
        run: |
          echo "============================================"
          echo "✅ VALIDATION PIPELINE COMPLETED"
          echo "============================================"
          echo ""
          echo "Summary of changes:"
          echo "- TypeScript compilation: PASSED ✅"
          echo "- Build validation: PASSED ✅"
          echo "- Migration checks: PASSED ✅"
          echo "- Code quality: CHECKED ✅"
          echo ""
          echo "All systems ready for deployment!"
          echo "============================================"
